name: Deploy backend docs (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Export OpenAPI and API reference
        working-directory: backend
        run: |
          uv sync
          uv run python scripts/generate_api_docs.py
          uv run python scripts/export_openapi.py

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Build site
        env:
          SITE_URL: https://${{ github.event.repository.owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          mkdocs build --strict -d site
          cp docs/openapi.json site/openapi.json
          cp docs/backend/redoc.html site/redoc.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
