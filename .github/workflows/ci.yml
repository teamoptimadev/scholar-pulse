name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prj649
          POSTGRES_PASSWORD: test
          POSTGRES_DB: academic_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://localhost:5432/academic_analytics
      PGUSER: prj649
      PGPASSWORD: test
      SECRET_KEY: ci-test-secret-key-min-32-chars-long
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend dependencies
        run: uv sync --group dev
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Seed test data
        run: uv run python scripts/seed.py --scale 100
      - name: Lint backend
        run: uv run ruff check app tests
      - name: Run backend tests
        run: uv run pytest

  client:
    name: Client (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('client/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install client dependencies
        run: bun install --frozen-lockfile
      - name: Lint client
        run: bun run lint
      - name: Build client
        run: bun run build
